<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkspaceBattery</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>WorkspaceBattery</h1>
      <div class="server-status" id="serverStatus">
        <span class="status-dot"></span>
        <span class="status-text">Checking...</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item active" data-view="chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg>
        Chat
      </button>
      <button class="nav-item" data-view="models">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
          <polyline points="3.27 6.96 12 12.01 20.73 6.96" />
          <line x1="12" y1="22.08" x2="12" y2="12" />
        </svg>
        Models
      </button>
      <button class="nav-item" id="openWorkspaceBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
          <polyline points="15 3 21 3 21 9" />
          <line x1="10" y1="14" x2="21" y2="3" />
        </svg>
        Open Workspace
      </button>
      <button class="nav-item" data-view="settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
        Settings
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="model-indicator" id="modelIndicator">
        <span class="model-name">No model loaded</span>
      </div>
      <div class="powered-by">Powered by llama.cpp</div>
    </div>
  </aside>

  <main class="main-content">
    <!-- Chat View -->
    <div class="view active" id="viewChat">
      <div class="chat-header">
        <h2>Chat</h2>
        <div class="chat-model-controls">
          <select id="modelSelector" disabled>
            <option value="">— Select a model —</option>
          </select>
          <button id="loadModelBtn" class="btn btn-sm" disabled>Load</button>
        </div>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="message empty-state">
          <div class="empty-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            </svg>
          </div>
          <p>Load a model to start chatting.</p>
          <p class="sub">Use the selector above to load a model, then send a message.</p>
        </div>
      </div>
      <div class="chat-input">
        <textarea id="chatInput" rows="1" placeholder="Send a message..." disabled></textarea>
        <button id="sendBtn" class="btn" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13" />
            <polygon points="22 2 15 22 11 13 2 9 22 2" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Models View -->
    <div class="view" id="viewModels">
      <div class="view-header">
        <h2>Models</h2>
      </div>
      <div class="models-content" id="modelsContent">
        <div class="loading-state">Loading models...</div>
      </div>
    </div>

    <!-- Settings View -->
    <div class="view" id="viewSettings">
      <div class="view-header">
        <h2>Settings</h2>
      </div>
      <div class="settings-content">
        <section class="settings-section">
          <h3>Connection</h3>
          <div class="setting-row">
            <label for="llamaPort">llama-server port</label>
            <input type="number" id="llamaPort" value="8080" min="1024" max="65535" class="setting-input">
          </div>
          <div class="setting-row">
            <label for="webPort">Web UI port</label>
            <input type="number" id="webPort" value="8333" min="1024" max="65535" class="setting-input">
          </div>
        </section>
        <section class="settings-section">
          <h3>Info</h3>
          <div class="setting-row">
            <span class="setting-label">Server</span>
            <span class="setting-value" id="infoStatus">—</span>
          </div>
          <div class="setting-row">
            <span class="setting-label">llama-server URL</span>
            <span class="setting-value mono" id="infoUrl">—</span>
          </div>
          <div class="setting-row">
            <span class="setting-label">Web UI</span>
            <span class="setting-value mono" id="infoWebUrl">—</span>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>

</html>
